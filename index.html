<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지우의 iPhone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0e0f12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#phone{position:absolute;left:50%;top:50%;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#222;box-shadow:0 0 0 2px #2a2c31,0 30px 80px #0009}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.03);transition:opacity .35s,transform .35s}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(#0003,#0000 30%,#0005)}
.status{position:absolute;top:0;left:0;right:0;height:54px;padding:19px 30px 0 36px;display:flex;justify-content:space-between;font-size:16px;font-weight:600;z-index:5}
.status .r{display:flex;gap:7px;align-items:center;font-size:14px}
.bat{min-width:28px;height:14px;padding:0 4px;border-radius:4px;background:#fff;color:#111;font-size:10px;font-weight:700;display:grid;place-items:center}
.glass{background:rgba(255,255,255,.26);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}

/* 잠금화면 */
#lock .date{position:absolute;top:90px;width:100%;text-align:center;font-size:20px;font-weight:600}
#lock .clock{position:absolute;top:114px;width:100%;text-align:center;font-size:98px;font-weight:700;letter-spacing:-3px;line-height:1.05}
#swipe{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.85;padding:10px}
.hbar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fff;opacity:.85;z-index:6;pointer-events:none}

/* 암호 입력 */
#passcode .bg{filter:blur(30px) brightness(.5);transform:scale(1.2)}
.pt{position:absolute;top:118px;width:100%;text-align:center;font-size:19px;font-weight:500}
.dots{position:absolute;top:164px;left:0;right:0;display:flex;justify-content:center;gap:22px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots i.f{background:#fff}
.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.pad{position:absolute;top:262px;left:50%;margin-left:-135px;width:270px;display:grid;grid-template-columns:repeat(3,78px);gap:14px 18px}
.pad button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pad button small{font-size:10px;letter-spacing:2px;margin-top:2px;height:11px}
.pad button:active{background:rgba(255,255,255,.55)}
.pad .e{background:none;backdrop-filter:none;pointer-events:none}
.pf{position:absolute;bottom:50px;left:50px;right:50px;display:flex;justify-content:space-between;font-size:17px}

/* 홈화면 */
.grid{position:absolute;top:66px;left:24px;right:24px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:94px}
.w{grid-column:span 2;grid-row:span 2;margin:0 3px 10px;border-radius:24px;padding:14px;display:flex;flex-direction:column;overflow:hidden}
.wx{background:linear-gradient(160deg,#3f7fd6,#8ec1f0)}
.wx small{font-size:13px;font-weight:600}
.wx .tp{font-size:42px;font-weight:300;line-height:1.1;margin-top:2px}
.wx .cd{margin-top:auto;font-size:13px;line-height:1.35}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:8px;font-size:11px;text-shadow:0 1px 3px #0006}
.ic{position:relative;width:60px;height:60px;box-shadow:0 2px 6px #0003;border-radius:15px}
.sq{width:100%;height:100%;border-radius:15px;overflow:hidden}.sq svg{display:block;width:100%;height:100%}
.bd{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#f0483e;color:#fff;font-size:15px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 .5px #0002}
.search{position:absolute;left:50%;bottom:104px;margin-left:-26px;width:52px;height:20px;border-radius:10px;font-size:10.5px;display:flex;align-items:center;justify-content:center;gap:3px;background:rgba(150,140,135,.42);border:1px solid rgba(255,255,255,.38)}
.dock{position:absolute;left:14px;right:14px;bottom:25px;height:75px;border-radius:38px;padding:0 19.7px;display:flex;justify-content:space-between;align-items:center;background:rgba(150,140,135,.42);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.36)}
.dock .app{padding:0}.dock .ic{box-shadow:none;width:57.5px;height:57.5px;border-radius:0}.dock .app span{display:none}
.pic{display:block;width:100%;height:100%}
.pbd{position:absolute;left:75.3%;top:-11.2%;min-width:34.3%;height:19.7px;padding:0 5px;border-radius:10px;background:#fd3b35;color:#fff;font-size:13px;font-weight:500;display:grid;place-items:center;pointer-events:none}

/* 흰색 앱 화면 (문자, 사진) */
.light{background:#fff;color:#000}
.bar{position:absolute;top:54px;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #e5e5ea;background:#f8f8fa;font-weight:600;font-size:17px}
.back{position:absolute;left:12px;color:#0a84ff;font-size:17px;font-weight:400}
.list{position:absolute;top:111px;bottom:70px;left:0;right:0;overflow-y:auto;padding:14px 14px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:76%;padding:9px 14px;border-radius:19px;font-size:16px;line-height:1.35}
.bub.me{align-self:flex-end;background:#0a84ff;color:#fff}
.bub.them{align-self:flex-start;background:#e9e9eb}
.inp{position:absolute;bottom:26px;left:14px;right:14px;height:36px;border:1px solid #d1d1d6;border-radius:18px;padding:7px 14px;color:#aaa;font-size:15px}
.ph{position:absolute;top:111px;bottom:0;left:0;right:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start}
.ph div{aspect-ratio:1;background-size:cover;background-position:center;background-color:#d8dce2}

/* 메모 앱 */
.nbg{background:#f2f2f7;color:#000}
.cbtn{position:absolute;top:56px;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 6px #0001}
.cbtn svg{width:20px;height:20px;fill:none;stroke:#000;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nt1{position:absolute;top:112px;left:5px;font-size:34px;font-weight:800;letter-spacing:-.5px;padding-left:0}
.nsub{position:absolute;top:156px;left:5px;font-size:12px;color:#8e8e93}
.nsub b{font-weight:400;color:#6f9fe0}
.nsec{position:absolute;top:186px;left:5px;font-size:19px;font-weight:700}
.ncard{position:absolute;top:224px;left:3px;right:3px;background:#fff;border-radius:22px;padding:0 13px;overflow:hidden}
.nrow{display:block;width:100%;text-align:left;padding:10px 0 11px;border-bottom:1px solid #e5e5ea}
.nrow:last-child{border-bottom:0}
.nrow b{display:block;font-size:15px;font-weight:600;margin-bottom:3px}
.nrow span{display:flex;gap:9px;font-size:12px;color:#8e8e93;white-space:nowrap}
.nrow span i{font-style:normal;flex:none}
.nrow span em{font-style:normal;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nbar{position:absolute;left:12px;right:12px;bottom:22px;display:flex;gap:10px;align-items:center}
.nsearch{flex:1;height:48px;border-radius:24px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;color:#8e8e93;box-shadow:0 1px 8px #0001}
.nsearch svg,.nplus svg{width:22px;height:22px;fill:none;stroke:#000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nsearch svg:last-child{margin-left:auto}
.nplus{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 8px #0001}
.nd{background:#fff;color:#000}
.ndt{position:absolute;top:108px;left:5px;right:12px;font-size:23px;font-weight:700;color:#4a3d34}
.ndb{position:absolute;top:158px;left:5px;right:12px;bottom:90px;overflow-y:auto;font-size:15px;line-height:1.5;color:#4a4a4f;white-space:pre-wrap;word-break:keep-all}
.ntool{position:absolute;bottom:26px;left:12px;height:44px;border-radius:22px;background:#fff;box-shadow:0 1px 10px #0002;display:flex;gap:16px;align-items:center;padding:0 16px}
.ntool svg{width:22px;height:22px;fill:none;stroke:#000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ntool.r{left:auto;right:12px;padding:0 11px}

/* 카카오톡 */
.kk{background:#fff;color:#000}
.kt{position:absolute;top:50px;left:16px;font-size:24px;font-weight:800}
.kic{position:absolute;top:54px;right:14px;display:flex;gap:17px}
.kic svg,.kbar svg,.kh svg{width:24px;height:24px;fill:none;stroke:#000;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.kchips{position:absolute;top:92px;left:14px;right:0;display:flex;gap:8px;overflow:hidden}
.chip{flex:none;height:30px;padding:0 13px;border-radius:15px;background:#f2f2f2;color:#555;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip.on{background:#1c1c1c;color:#fff}
.chip svg{width:18px;height:18px;fill:none;stroke:#555;stroke-width:1.8;stroke-linecap:round}
.ub{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff5a1f;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.krow{position:absolute;top:146px;left:0;right:0;display:flex;gap:11px;padding:8px 14px;text-align:left;width:100%}
.av{flex:none;width:44px;height:44px;border-radius:17px;background:#d8dbe0 center/cover no-repeat;overflow:hidden;display:block}
.av svg{width:100%;height:100%;display:block}
.krow .m{flex:1;min-width:0;padding-top:1px}
.krow .m b{display:flex;align-items:center;gap:4px;font-size:15px;font-weight:500}
.krow .m b svg{width:11px;height:11px;fill:none;stroke:#aaa;stroke-width:2;stroke-linecap:round}
.krow .m>span{display:block;font-size:13px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krow .r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:#999;padding-top:2px}
.kbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #f0f0f0;display:flex;justify-content:space-around;padding-top:14px}
.kbar div{position:relative;height:28px}
.kbar svg{stroke:none;fill:#b9b9b9;width:26px;height:26px}
.kbar .on svg{fill:#1c1c1c}
.kbar .ub{position:absolute;top:-8px;right:-10px;min-width:16px;height:16px;font-size:10px}
.kroom{background:#bacee0;color:#000}
.kh{position:absolute;top:54px;left:0;right:0;height:44px;display:flex;align-items:center;padding:0 16px;gap:18px;font-size:17px;font-weight:600}
.kh .sp{flex:1}
.kh button{display:grid}
.kdate{position:absolute;top:104px;left:50%;transform:translateX(-50%);background:#a4b6c8;color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;white-space:nowrap}
.kmsgs{position:absolute;top:136px;left:0;right:0;bottom:66px;overflow-y:auto;padding:0 10px;display:flex;flex-direction:column;gap:5px}
.kg{display:flex;gap:8px;align-items:flex-start}
.kg .av{width:36px;height:36px;border-radius:14px}
.kcol{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.kname{font-size:11px;color:#444;margin:0 0 -1px 2px}
.kb{display:flex;align-items:flex-end;gap:5px}
.kb p{background:#fff;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.3;max-width:230px}
.kb small{font-size:9px;color:#555;white-space:nowrap}
.kme{align-self:flex-end;flex-direction:row-reverse}
.kme p{background:#fee500}
.kin{position:absolute;left:0;right:0;bottom:0;height:66px;background:#fff;display:flex;align-items:flex-start;gap:8px;padding:8px 12px 0}
.kin svg{width:26px;height:26px;stroke:#222;fill:none;stroke-width:1.8;stroke-linecap:round;margin-top:3px}
.kin div{flex:1;height:38px;border-radius:19px;background:#f2f2f2;color:#888;font-size:14px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 12px}
.kin div svg{margin:0;width:24px;height:24px}

/* 메시지 앱 */
.sm{background:#fff;color:#000}
.sedit{position:absolute;top:56px;left:20px;color:#0a84ff;font-size:17px}
.snew{position:absolute;top:54px;right:18px}
.snew svg,.sh svg{width:24px;height:24px;fill:none;stroke:#0a84ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.st1{position:absolute;top:86px;left:20px;font-size:34px;font-weight:800}
.ssr{position:absolute;top:128px;left:19px;right:19px;height:34px;border-radius:10px;background:#eeeef0;color:#8e8e93;font-size:16px;display:flex;align-items:center;gap:6px;padding:0 9px}
.ssr svg{width:14px;height:14px;fill:none;stroke:#8e8e93;stroke-width:2.4;stroke-linecap:round}
.srow{position:absolute;top:170px;left:0;right:0;display:flex;gap:6px;padding:0 0 0 24px;text-align:left;width:100%}
.sav{flex:none;width:36px;height:36px;border-radius:50%;background:#a3c4b0;color:#fff;font-size:16px;font-weight:700;display:grid;place-items:center;margin-top:10px}
.srow .m{flex:1;min-width:0;border-bottom:1px solid #e5e5ea;padding:10px 12px 11px 6px;height:58px;margin-left:5px}
.srow .t1{display:flex;justify-content:space-between;font-size:16px}
.srow .t1 b{font-weight:600}
.srow .t1 span{color:#8e8e93;font-size:15px}
.srow .t2{font-size:14px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;max-width:260px}
.sh{position:absolute;top:44px;left:0;right:0;height:80px;background:#f8f8fa;border-bottom:1px solid #e5e5ea;text-align:center}
.sh button{position:absolute;top:18px}
.sh .sav{margin:6px auto 0;width:40px;height:40px;font-size:17px}
.sh small{display:block;font-size:11px;margin-top:2px}
.sdt{align-self:stretch;text-align:center;font-size:11px;font-weight:600;color:#8e8e93;margin:12px 0 6px}
.smsgs{position:absolute;top:132px;left:0;right:0;bottom:78px;overflow-y:auto;padding:0 12px;display:flex;flex-direction:column;gap:3px}
.sb{max-width:76%;padding:8px 14px;border-radius:18px;font-size:16px;line-height:1.3}
.sb.me{align-self:flex-end;background:#0a84ff;color:#fff}
.sb.them{align-self:flex-start;background:#e9e9eb;margin-top:6px}
.srd{align-self:flex-end;font-size:11px;color:#8e8e93;margin:1px 4px 4px 0}
.sin{position:absolute;left:12px;right:12px;bottom:26px;display:flex;gap:10px;align-items:center}
.sin i{flex:none;width:34px;height:34px;border-radius:50%;background:#e9e9eb;color:#777;font-style:normal;font-size:26px;display:grid;place-items:center;line-height:1}
.sin div{flex:1;height:36px;border:1px solid #d1d1d6;border-radius:18px;padding:7px 14px;color:#b0b0b6;font-size:16px}

/* 전화 */
.call{text-align:center}
.call .bg{filter:blur(28px) brightness(.55);transform:scale(1.2)}
.call h1{position:absolute;top:150px;width:100%;font-size:38px;font-weight:500}
.call p{position:absolute;top:204px;width:100%;font-size:19px;opacity:.75}
.cb{position:absolute;bottom:110px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px}
.cb i{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.red{background:#ff3b30}.grn{background:#34c759}
.end{transform:rotate(135deg)}
/* 전화 수신 화면 */
#incoming{background:linear-gradient(#6b6d71,#3b3e42)}
#incoming h1{top:104px;font-size:28px;font-weight:700}
#incoming p{top:78px;font-size:15px;opacity:.6}
.iinfo{position:absolute;top:74px;right:20px;width:22px;height:22px;border:1.6px solid #fff8;border-radius:50%;color:#fff8;font-size:13px;font-weight:700;display:grid;place-items:center;font-family:Georgia,serif}
.ib{position:absolute;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;width:110px;margin-left:-55px}
.ib i{border-radius:50%;display:grid;place-items:center}
.ib.s i{width:48px;height:48px;background:#ffffff30}
.ib.s svg{width:22px;height:22px;fill:#fff}
.ib.b i{width:76px;height:76px}
/* 통화 중 화면 */
#incall{background:linear-gradient(#4b4d56,#2e3036 38%,#1b1c20 70%,#141418)}
#incall h1{top:93px;font-size:31px;font-weight:500}
#incall p{top:146px;font-size:25px;font-weight:400;opacity:.62;font-variant-numeric:tabular-nums}
.kp{position:absolute;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;width:90px;margin-left:-45px}
.kp i{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.27);display:grid;place-items:center}
.kp svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kp svg.f{fill:#fff;stroke:none}
.hg{position:absolute;left:203px;top:683px;margin-left:-38px;width:76px;height:76px}
.hg i{flex:none;width:76px;height:76px;border-radius:50%;background:#ec4e3f;display:grid;place-items:center}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.screen,.toast{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="phi" viewBox="0 0 24 24"><path fill="#fff" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></symbol></svg>

<div id="phone">
  <!-- 잠금화면 -->
  <section class="screen on" id="lock">
    <div class="bg wp"></div>
    <div class="status"><span>SKT</span><span class="r"><span class="bat bt"></span></span></div>
    <div class="date" id="ldate"></div>
    <div class="clock t"></div>
    <button id="swipe">위로 쓸어올려 열기</button><div class="hbar"></div>
  </section>

  <!-- 암호 입력 -->
  <section class="screen" id="passcode">
    <div class="bg wp"></div>
    <div class="status"><span>SKT</span><span class="r"><span class="bat bt"></span></span></div>
    <div class="pt">암호 입력</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <div class="pf"><span>긴급 상황</span><button id="pcancel">취소</button></div>
    <div class="hbar"></div>
  </section>

  <!-- 홈화면 -->
  <section class="screen" id="home">
    <div class="bg wp"></div>
    <div class="status"><span class="t"></span><span class="r">SKT <span class="bat bt"></span></span></div>
    <div class="grid" id="grid">
      <div class="w wx"><small id="wc"></small><div class="tp" id="wt"></div><div class="cd" id="wd"></div></div>
    </div>
    <div class="search"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>검색</div>
    <div class="dock" id="dock"></div>
    <div class="hbar"></div>
  </section>

  <!-- 메시지 목록 (1화면) -->

/* ============================================================

const CONFIG = {

    read: true,                        // 내 마지막 말풍선 아래 "읽음" 표시

      // 날짜를 중간에 넣으려면 아래처럼 한 줄 추가 (앞 줄 끝에 쉼표 필요)
      // { date: "10월 22일 (목) 오전 9:30" },
    ]
  },

  callDelaySec: 8,                   // 홈화면에 들어온 뒤 몇 초 후에 전화가 올지
  callAudio: ["call.mp3","call.m4a","call.wav","call.aac","call.ogg"],  // 전화를 받으면 재생될 소리 파일 (순서대로 찾아서 있는 것을 재생)
  ringtone: "",                      // 벨소리 mp3 (없으면 "" 그대로 두기)

  weather: { city: "서울", temp: "18°", cond: "대체로 맑음", range: "최고 22° 최저 12°" },

  // 메모 앱: 제목, 날짜, 내용 (내용 줄바꿈은 \n)

    listDate: "10월 6일",            // 채팅 목록에 보이는 날짜

  // 홈화면 앱: [이름, 아이콘, 이동할 화면]  (화면이 없으면 "준비 중" 안내)

  ],
  dock: [["전화","phone"],["Safari","safari"],["메시지","messages","messages"],["음악","music"]]

const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const C = CONFIG, phone = $("#phone");
let scale = 1, started = false, audio, ring, tick, pin = "";

/* 화면 크기에 맞게 확대/축소 */
function fit(){
  scale = Math.min(innerWidth/390, innerHeight/844);
  phone.style.transform = `translate(-50%,-50%) scale(${scale})`;
  phone.style.borderRadius = innerWidth <= 500 ? "0" : "48px";
}
addEventListener("resize", fit); fit();

/* 내용 채우기 */
const now = new Date();
const timeStr = C.time || now.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
const dateStr = C.date || now.toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"});
$$(".t").forEach(e => e.textContent = timeStr);
if (!C.time) setInterval(() => {  // 실제 시간일 때는 계속 흘러가게
  const t = new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
  $$(".t").forEach(e => e.textContent = t);
}, 10000);
$$(".bt").forEach(e => e.textContent = C.battery);
$("#ldate").textContent = dateStr;
$$(".cn").forEach(e => e.textContent = C.callerName);
$("#wc").textContent = C.weather.city; $("#wt").textContent = C.weather.temp;
$("#wd").innerHTML = C.weather.cond + "<br>" + C.weather.range;

const grad = "linear-gradient(160deg,#6d8fb5,#c9a9c4)";
$("#lock .wp").style.backgroundImage = `url("${C.lockWallpaper}"),${grad}`;
$$("#passcode .wp,#home .wp,.call .wp").forEach(e => e.style.backgroundImage = `url("${C.homeWallpaper}"),${grad}`);

/* 메시지 앱 */
const M = C.sms, mLast = M.messages[M.messages.length-1];
$$(".sn").forEach(e => e.textContent = M.name);
$("#sname").textContent = M.name; $("#srname").textContent = M.name;
$("#sday").textContent = M.listDay;
/* 대화 목록: { date: "..." } 는 날짜 줄, { from, text } 는 말풍선. 맨 위에 날짜가 없으면 roomDate를 넣어요 */
const mItems = M.messages[0] && M.messages[0].date ? M.messages.slice() : [{ date: M.roomDate }].concat(M.messages);
const mTexts = mItems.filter(m => m.text);
$("#sprev").textContent = mTexts.length ? mTexts[mTexts.length-1].text : "";
const lastMe = mItems.map(m => m.from).lastIndexOf("me");
$("#smsgs").innerHTML = mItems.map((m,i) => m.date ? `<div class="sdt"></div>` : `<div class="sb ${m.from}"></div>` + (M.read && i === lastMe ? `<div class="srd">읽음</div>` : "")).join("");
const mEls = $("#smsgs").querySelectorAll(".sdt,.sb");
mItems.forEach((m,i) => mEls[i].textContent = m.date || m.text);
$("#srow").onclick = () => { show("msgroom"); $("#smsgs").scrollTop = $("#smsgs").scrollHeight; };
$("#sback").onclick = () => show("home");
$("#plist").innerHTML = C.photos.map(p => `<div style="background-image:url('${p}')"></div>`).join("");

const IC = s => `<svg viewBox="0 0 60 60">${s}</svg>`;

  camera: () => IC(g("gC","#eeeef0","#b4b4bb") + `<rect width="60" height="60" fill="url(#gC)"/><rect x="22" y="14" width="16" height="7" rx="2.5" fill="#2c2c2e"/><rect x="10" y="19" width="40" height="27" rx="6.5" fill="#2c2c2e"/><circle cx="30" cy="32.5" r="9.5" fill="#111" stroke="#5e5e63" stroke-width="2"/><circle cx="30" cy="32.5" r="4.2" fill="#1d3a5a"/><circle cx="43" cy="25" r="1.7" fill="#ffd60a"/>`),
  settings: () => IC(g("gT","#c4c6cc","#8c8e96") + `<rect width="60" height="60" fill="url(#gT)"/><circle cx="30" cy="30" r="17.5" fill="none" stroke="#4a4a4e" stroke-width="5" stroke-dasharray="5.5 5.5"/><circle cx="30" cy="30" r="15.5" fill="#4a4a4e"/><circle cx="30" cy="30" r="6.5" fill="#a0a2a9"/>`),
  calendar: () => IC(`<rect width="60" height="60" fill="#fff"/><text x="30" y="15.5" text-anchor="middle" font-size="9" font-weight="600" fill="#ff3b30">${calWd}</text><text x="30" y="46.5" text-anchor="middle" font-size="31" font-weight="300" fill="#111">${calDay}</text>`),
  clock: () => IC(`<rect width="60" height="60" fill="#111"/><circle cx="30" cy="30" r="25" fill="#fff"/><circle cx="30" cy="30" r="21.5" fill="none" stroke="#111" stroke-width="3" stroke-dasharray=".9 10.36"/><line x1="30" y1="30" x2="30" y2="18" stroke="#111" stroke-width="2.8" stroke-linecap="round" transform="rotate(${(hh%12)*30+mm/2} 30 30)"/><line x1="30" y1="30" x2="30" y2="11" stroke="#111" stroke-width="2.2" stroke-linecap="round" transform="rotate(${mm*6} 30 30)"/><circle cx="30" cy="30" r="2" fill="#ff9f0a"/>`),
  notes: () => IC(`<rect width="60" height="60" fill="#fff"/><rect width="60" height="17" fill="#ffd60a"/><path d="M8 29H52M8 38H52M8 47H52" stroke="#e1e1e6" stroke-width="1.6"/>`),
  appstore: () => IC(g("gA","#22c9ff","#0a64f0") + `<rect width="60" height="60" fill="url(#gA)"/><g stroke="#fff" stroke-width="4.4" stroke-linecap="round" fill="none"><path d="M30 15.5L42 40"/><path d="M30 15.5L18 40"/><path d="M18.5 35.5H41.5" stroke-width="3.6"/></g>`),
  kakao: () => IC(`<rect width="60" height="60" fill="#fee500"/><ellipse cx="30" cy="28" rx="19.5" ry="15.5" fill="#3a1d1d"/><path d="M20 38.5L17 47l10.5-6z" fill="#3a1d1d"/><text x="30" y="31.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fee500" font-family="Arial,sans-serif">TALK</text>`)
};

function appHTML(a){
  const art = ICON[a[1]](), photo = art.startsWith("<img");   // 사진에서 잘라낸 아이콘은 그대로 표시
  const num = a[1] === "messages" ? C.messageBadge : a[1] === "kakao" ? C.kakaoBadge : 0;
  const badge = num ? `<b class="pbd">${num}</b>` : "";
  return `<button class="app" data-app="${a[2]||""}" data-name="${a[0]}"><div class="ic">${photo ? art : `<div class="sq">${art}</div>`}${badge}</div><span>${a[0]}</span></button>`;
}
$("#grid").insertAdjacentHTML("beforeend", C.apps.map(appHTML).join(""));
$("#dock").innerHTML = C.dock.map(appHTML).join("");

/* 메모 앱 */
$("#ncount").innerHTML = `${C.notes.length}개의 <b>메모</b>`;
$("#nlist").innerHTML = C.notes.map((n,i) => `<button class="nrow" data-i="${i}"><b></b><span><i></i><em></em></span></button>`).join("");
$$("#nlist .nrow").forEach(r => {
  const n = C.notes[r.dataset.i];
  r.querySelector("b").textContent = n.title;
  r.querySelector("i").textContent = n.date;
  r.querySelector("em").textContent = n.body.replace(/\n/g, " ");
  r.onclick = () => { $("#ndt").textContent = n.title; $("#ndb").textContent = n.body; show("note"); };
});

/* 카카오톡 */
const K = C.kakao, kLast = K.messages[K.messages.length-1];
const noAv = `<svg viewBox="0 0 44 44"><rect width="44" height="44" fill="#d8dbe0"/><circle cx="22" cy="17" r="8" fill="#fff"/><path d="M6 44c0-10 7-15 16-15s16 5 16 15z" fill="#fff"/></svg>`;
function setAv(el){ el.innerHTML = noAv; const im = new Image(); im.onload = () => { el.innerHTML = ""; el.style.backgroundImage = `url("${K.avatar}")`; }; im.src = K.avatar; }
$("#kname").textContent = K.name; $("#krname").textContent = K.name;
$("#kprev").textContent = kLast.text; $("#kdate").textContent = K.listDate; $("#krdate").textContent = K.roomDate;
$$(".kk .ub").forEach(u => { if (!K.unread) u.style.display = "none"; else if (u.textContent === "2") u.textContent = K.unread; });
$("#kmsgs").innerHTML = K.messages.map((m,i) => {
  const last = i === K.messages.length-1, first = i === 0 || K.messages[i-1].from !== m.from;
  const time = last || K.messages[i+1].from !== m.from ? `<small>${K.time}</small>` : "";
  if (m.from === "me") return `<div class="kb kme"><p></p>${time}</div>`;
  return `<div class="kg">${first ? `<span class="av kav"></span>` : `<span style="width:36px;flex:none"></span>`}<div class="kcol">${first ? `<div class="kname">${K.name}</div>` : ""}<div class="kb"><p></p>${time}</div></div></div>`;
}).join("");
$$("#kmsgs .kb p").forEach((p,i) => p.textContent = K.messages[i].text);
$$(".kav").forEach(setAv);
$("#krow").onclick = () => { $$(".kk .ub").forEach(u => u.style.display = "none"); show("kroom"); };
$("#kback").onclick = () => show("home");

/* 화면 전환 */
function show(id){ $$(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1500); }

$$("[data-go]").forEach(b => b.onclick = () => show(b.dataset.go));
$$(".app").forEach(b => b.onclick = () => b.dataset.app ? show(b.dataset.app) : toast(b.dataset.name + " 앱은 준비 중이에요"));

/* 잠금 해제: 화면 아무 곳이나 탭하거나 스와이프 */
function unlock(){ pin = ""; updDots(); show("passcode"); }
$("#lock").addEventListener("pointerup", unlock);   // 탭, 스와이프 모두

/* 암호 입력 */
const L = C.passcode.length, dots = $("#dots");
dots.innerHTML = "<i></i>".repeat(L);
const sub = {2:"ABC",3:"DEF",4:"GHI",5:"JKL",6:"MNO",7:"PQRS",8:"TUV",9:"WXYZ"};
$("#pad").innerHTML = [1,2,3,4,5,6,7,8,9,"",0,""].map(n => n === "" ? `<button class="e"></button>` : `<button data-n="${n}">${n}<small>${sub[n]||""}</small></button>`).join("");
function updDots(){
  [...dots.children].forEach((d,i) => d.classList.toggle("f", i < pin.length));
  $("#pcancel").textContent = pin ? "삭제" : "취소";
}
$$("#pad [data-n]").forEach(b => b.onclick = () => {
  if (pin.length >= L) return;
  pin += b.dataset.n; updDots();
  if (pin.length < L) return;
  setTimeout(() => {
    if (pin === C.passcode){ pin = ""; updDots(); show("home"); startCallTimer(); }
    else { dots.classList.add("shake"); setTimeout(() => { dots.classList.remove("shake"); pin = ""; updDots(); }, 400); }
  }, 150);
});
$("#pcancel").onclick = () => { if (pin){ pin = pin.slice(0,-1); updDots(); } else show("lock"); };

/* 전화 */
function startCallTimer(){
  if (started) return; started = true;
  setTimeout(() => {
    show("incoming");
    if (navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
    if (C.ringtone){ ring = new Audio(C.ringtone); ring.loop = true; ring.play().catch(()=>{}); }
  }, C.callDelaySec * 1000);
}
function stopRing(){ if (ring){ ring.pause(); ring = null; } }
function endCall(){
  clearInterval(tick); stopRing();
  if (audio){ audio.pause(); audio = null; }
  show("home");
}
$("#decline").onclick = endCall;
$("#hang").onclick = endCall;
function playCallAudio(i){
  const list = [].concat(C.callAudio);
  if (i >= list.length){ toast("소리 파일을 찾을 수 없어요 (call.mp3 / call.m4a)"); return; }
  const a = new Audio(list[i]); audio = a;
  a.onerror = () => { if (audio === a) playCallAudio(i+1); };
  a.onended = endCall;
  a.play().catch(err => { if (err && err.name === "NotAllowedError") toast("화면을 한 번 터치한 뒤 다시 시도해 주세요"); else if (audio === a) playCallAudio(i+1); });
}
$("#accept").onclick = () => {
  stopRing(); show("incall");
  playCallAudio(0);
  let s = 0; $("#ctime").textContent = "00:00";
  tick = setInterval(() => { s++; $("#ctime").textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); }, 1000);
};
</script>
